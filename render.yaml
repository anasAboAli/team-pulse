# Render Blueprint — خدمة ويب واحدة: Express يخدم الـ API والواجهة المبنية معاً.
# الاستخدام: Render Dashboard → New → Blueprint → اختر هذا المستودع.
# المتغيرات ذات sync: false يطلبها Render منك عند الإنشاء (لا تُكتب في المستودع).
services:
  - type: web
    name: team-pulse
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: >-
      npm ci --prefix server --omit=dev &&
      npm ci --prefix client --include=dev &&
      npm run build --prefix client
    startCommand: npm run start:prod --prefix server
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

      # قاعدة البيانات — رابط اتصال MySQL مع SSL، مثال:
      # mysql://USER:PASSWORD@HOST:4000/teampulse?ssl=true
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"

      # أسرار التوثيق — يولّدها Render تلقائياً
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # التشغيل الأول على قاعدة فارغة
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SEED_ADMIN_EMAIL
        value: admin@teampulse.test
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_PASSWORD
        sync: false

      # أزرار الدخول السريع في صفحة الدخول (اختياري — لموقع عرض تجريبي فقط)
      - key: VITE_DEMO_LOGIN
        value: "false"
